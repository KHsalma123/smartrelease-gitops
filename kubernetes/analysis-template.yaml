apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smartrelease-success-rate
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 3
      successCondition: result[0] >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            sum(
              rate(
                http_requests_total{
                  app="smartrelease-canary-test",
                  status="2xx",
                  handler!="/metrics"
                }[5m]
              )
            )
            /
            sum(
              rate(
                http_requests_total{
                  app="smartrelease-canary-test",
                  handler!="/metrics"
                }[5m]
              )
            )
