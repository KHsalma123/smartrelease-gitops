apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartrelease
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartrelease
  template:
    metadata:
      labels:
        app: smartrelease
    spec:
      containers:
        - name: smartrelease
          image: smartrelease-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v1"
            - name: APP_STATUS
              value: "healthy"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
