apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: smartrelease-canary-test
spec:
  replicas: 2

  selector:
    matchLabels:
      app: smartrelease-canary-test

  template:
    metadata:
      labels:
        app: smartrelease-canary-test
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: smartrelease
          image: ghcr.io/khsalma123/smartrelease-app:error-test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: v2
            - name: APP_STATUS
              value: "healthy"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi


  strategy:
    canary:
      stableService: smartrelease-canary-test-stable-service
      canaryService: smartrelease-canary-test-service
      trafficRouting:
        nginx:
          stableIngress: smartrelease-canary-test-ingress
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: smartrelease-success-rate
        - pause: {}
        - setWeight: 50
        - pause: {}
