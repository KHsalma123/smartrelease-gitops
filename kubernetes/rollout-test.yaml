apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: smartrelease-canary-test
spec:
  replicas: 2

  selector:
    matchLabels:
      app: smartrelease-canary-test

  template:
    metadata:
      labels:
        app: smartrelease-canary-test
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: smartrelease
          image: ghcr.io/khsalma123/smartrelease-app:sha-66a7f20
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v1-canary-test"
            - name: APP_STATUS
              value: "healthy"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 50
        - pause: {}
